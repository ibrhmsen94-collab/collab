name: TikTok yetkilendirme (tek seferlik)

on:
  workflow_dispatch:
    inputs:
      kod:
        description: "TikTok yönlendirme adresindeki ?code= değeri"
        required: true
      yonlendirme:
        description: "TikTok uygulamasına kaydettiğin Redirect URI (birebir aynı)"
        required: true

jobs:
  yetki:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu tokena çevir ve secret'a kaydet
        env:
          KOD: ${{ github.event.inputs.kod }}
          YON: ${{ github.event.inputs.yonlendirme }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          KOD=$(python3 -c "import urllib.parse,os;print(urllib.parse.unquote(os.environ['KOD']))")
          curl -sS -X POST https://open.tiktokapis.com/v2/oauth/token/ \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_key=$TT_CLIENT_KEY" --data-urlencode "client_secret=$TT_CLIENT_SECRET" \
            --data-urlencode "code=$KOD" --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "redirect_uri=$YON" -o yanit.json
          python3 -c "import json;d=json.load(open('yanit.json'));print('hata:',d.get('error'),d.get('error_description')) if 'refresh_token' not in d else print('tamam, kapsam:',d.get('scope'))"
          python3 -c "import json;open('rt','w').write(json.load(open('yanit.json')).get('refresh_token',''))"
          [ -s rt ] && echo "::add-mask::$(cat rt)" && gh secret set TT_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < rt && echo "TT_REFRESH_TOKEN kaydedildi"
          rm -f rt yanit.json
